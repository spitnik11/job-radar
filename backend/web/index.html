<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobber</title>
<style>
  :root{
    --canvas:#f7f6f4; --surface:#ffffff; --lift:#f0efec; --ink:#1c1c1e; --muted:#6b6b70; --subtle:#9a9aa0;
    --accent:#2c62e6; --accent-soft:rgba(44,98,230,.12); --hair:rgba(20,20,25,.10); --hair-soft:rgba(20,20,25,.06);
    --hover:rgba(20,20,25,.05); --good:#2f9e69; --good-soft:rgba(47,158,105,.14);
    --ok:#c98a12; --weak:#8a8a90; --danger:#df3b4c; --danger-soft:rgba(223,59,76,.14);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --canvas:#000000; --surface:#16181c; --lift:#1d1f23; --ink:#e7e9ea; --muted:#9aa0a6; --subtle:#6d6e76;
      --accent:#4d84ff; --accent-soft:rgba(77,132,255,.16); --hair:rgba(255,255,255,.13); --hair-soft:rgba(255,255,255,.07);
      --hover:rgba(255,255,255,.06); --good:#4cc389; --good-soft:rgba(76,195,137,.16);
      --ok:#e0a53a; --weak:#7a7a82; --danger:#f2495c; --danger-soft:rgba(242,73,92,.16);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:15px;
    line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;color:inherit}
  a{color:var(--accent);text-decoration:none}
  ::selection{background:var(--accent-soft)}
  /* subtle scrollbars that match the theme (esp. the right sidebar's secondary scrollbar) */
  html{scrollbar-width:thin;scrollbar-color:var(--hair) transparent}
  *::-webkit-scrollbar{width:9px;height:9px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:var(--hair);border-radius:9999px;border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-thumb:hover{background:var(--subtle)}
  svg{display:block}

  .app{display:flex;justify-content:center;gap:0;max-width:1290px;margin:0 auto}

  /* ---------- left nav ---------- */
  nav{width:260px;flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
    padding:6px 10px 16px;border-right:1px solid var(--hair)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;letter-spacing:-.02em;
    padding:12px 12px 16px}
  .brand .logo{width:30px;height:30px;object-fit:contain;flex:none}
  @media (prefers-color-scheme:dark){ .brand .logo{filter:invert(1)} }   /* black line-art -> white on dark */
  :root[data-theme="dark"] .brand .logo{filter:invert(1)}
  :root[data-theme="light"] .brand .logo{filter:none}
  .navitem{display:flex;align-items:center;gap:16px;padding:11px 14px;border-radius:9999px;font-size:19px;
    color:var(--ink);border:0;background:transparent;width:100%;text-align:left;line-height:1}
  .navitem:hover{background:var(--hover)}
  .navitem.on{font-weight:700}
  .navitem .ic{width:24px;height:24px;flex:none;color:var(--ink)}
  .navitem.on .ic{color:var(--accent)}
  .badge{margin-left:auto;font-size:12px;font-weight:600;color:var(--subtle);font-variant-numeric:tabular-nums}
  .sync{margin:16px 6px 0;padding:14px;border-radius:9999px;background:var(--accent);color:#fff;border:0;
    font-size:16px;font-weight:700;letter-spacing:.01em}
  .sync:hover{filter:brightness(1.06)} .sync:disabled{opacity:.6;cursor:default}
  .navfoot{padding:12px 14px 6px;font-size:12px;color:var(--subtle);font-family:var(--mono)}
  .streak{margin:14px 8px 0;padding:14px 12px;border:1px solid var(--hair);border-radius:14px;
    background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
  .streak .flame{width:46px;height:46px;object-fit:contain}
  .streak .flame.cold{filter:grayscale(1) brightness(1.15) opacity(.33)}
  .streak-count{font-size:14px;font-weight:700;letter-spacing:-.01em}

  /* ---------- center stream ---------- */
  .center{width:600px;flex:none;min-height:100vh;border-right:1px solid var(--hair)}
  .chead{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:16px;height:53px;padding:0 16px;
    background:color-mix(in srgb,var(--canvas) 82%,transparent);border-bottom:1px solid var(--hair);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .chead h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0}
  .chead .sub{font-size:12px;color:var(--subtle);margin-left:auto;font-variant-numeric:tabular-nums}
  .iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:flex;
    align-items:center;justify-content:center;color:var(--ink)}
  .iconbtn:hover{background:var(--hover)}

  /* card */
  .card{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--hair);
    cursor:pointer}
  .card:hover{background:var(--hover)}
  .card.sel{background:var(--hover);box-shadow:inset 3px 0 0 var(--accent)}
  .ring{width:52px;height:52px;border-radius:50%;border:2.5px solid currentColor;display:flex;flex-direction:column;
    align-items:center;justify-content:center;flex:none}
  .ring .n{font-size:17px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .ring .l{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
  .s-strong{color:var(--good)} .s-good{color:var(--accent)} .s-ok{color:var(--ok)} .s-weak{color:var(--weak)}
  .cbody{min-width:0}
  .ctop{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .ctop .t{font-weight:700;font-size:15px;color:var(--ink);letter-spacing:-.01em}
  .ctop .co,.ctop .dot,.ctop .tm{color:var(--subtle);font-size:14px}
  .cloc{font-size:13px;color:var(--muted);margin-top:2px}
  .xflag{font-size:11px;font-weight:600;color:var(--ok);background:rgba(201,138,18,.12);padding:1px 8px;border-radius:9999px}
  .newbanner{position:sticky;top:53px;z-index:3;display:flex;justify-content:center;padding:10px 0;
    background:color-mix(in srgb,var(--canvas) 82%,transparent);border-bottom:1px solid var(--hair);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .newbanner button{background:var(--accent);color:#fff;border:0;border-radius:9999px;padding:8px 20px;
    font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.18)}
  .newbanner button:hover{filter:brightness(1.06)}
  .card.open{background:var(--hover)}
  .more{font-size:14px;line-height:1.6;color:var(--ink);white-space:pre-wrap;margin:10px 0 4px;
    max-width:64ch;border-left:2px solid var(--hair);padding-left:12px}
  .more .tempty{color:var(--subtle)}
  .submeta{font-size:12px;color:var(--subtle);margin:-4px 0 12px;line-height:1.5}
  .ghstat{font-size:13px;color:var(--muted);font-weight:600}
  .ghskills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .ghbtn{width:100%;margin-top:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0 2px}
  .chip{font-size:12px;color:var(--muted);background:var(--lift);border:1px solid var(--hair-soft);
    padding:2px 9px;border-radius:9999px}
  .flag{font-size:12px;padding:2px 9px;border-radius:9999px;font-weight:600}
  .flag.warn{color:var(--ok);background:rgba(201,138,18,.12)} .flag.rem{color:var(--accent);background:var(--accent-soft)}
  /* action bar */
  .acts{display:flex;align-items:center;gap:4px;margin-top:8px;margin-left:-8px;flex-wrap:wrap}
  .act{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--subtle);
    font-size:13px;font-weight:500;padding:6px;border-radius:9999px;transition:color .12s,background .12s}
  .act .ic{width:18px;height:18px}
  .act:hover{background:var(--accent-soft);color:var(--accent)}
  .act.save.on{color:var(--accent)} .act.save.on .ic path{fill:currentColor}
  .act.apply:hover{background:var(--good-soft);color:var(--good)}
  .act.apply.on{color:var(--good);font-weight:600}
  .act.visit{color:var(--accent);font-weight:600}
  .act.visit:hover{background:var(--accent-soft);color:var(--accent)}
  .act.dismiss:hover{background:var(--danger-soft);color:var(--danger)}
  .act.spacer{margin-left:auto}
  .act.why:hover{background:var(--accent-soft);color:var(--accent)}

  /* detail */
  .detail{padding:8px 16px 60px}
  .detail .eyebrow{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--subtle);
    margin-top:10px}
  .detail h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:5px 0 3px;line-height:1.12}
  .detail .sub{font-size:15px;color:var(--muted);margin-bottom:14px}
  .verified{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--good);background:var(--good-soft);
    padding:4px 10px;border-radius:9999px;font-weight:600}
  .dpanel{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:18px 20px;margin:16px 0}
  .dpanel h4{margin:0 0 13px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .fac{margin-bottom:12px}
  .fac .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .fac .top b{font-weight:700} .fac .pts{color:var(--subtle);font-variant-numeric:tabular-nums}
  .bar{height:5px;background:var(--lift);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .fac .det{font-size:12px;color:var(--subtle);margin-top:5px}
  .desc{font-size:14px;line-height:1.65;white-space:pre-wrap;max-width:66ch}
  .kv{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .kv b{color:var(--ink);font-weight:700}
  .dacts{display:flex;gap:10px;margin:16px 0 4px}
  .btn{border:1px solid var(--hair);background:transparent;color:var(--ink);font-size:14px;font-weight:700;
    padding:9px 18px;border-radius:9999px}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent);color:#fff;border-color:transparent}
  .btn.on{color:var(--good);border-color:var(--good)}
  .stage{font-family:inherit;font-size:14px;background:var(--lift);color:var(--ink);border:1px solid var(--hair);
    border-radius:8px;padding:9px 11px;width:100%;max-width:300px}
  .noteadd{display:flex;gap:8px;margin-bottom:14px}
  .noteadd input{flex:1;background:var(--lift);border:1px solid var(--hair);border-radius:8px;padding:9px 12px;
    color:var(--ink);font-size:14px;outline:none}
  .noteadd input:focus{border-color:var(--accent)}
  .timeline .tempty{font-size:13px;color:var(--subtle)}
  .trow{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--hair-soft);font-size:13px}
  .trow:first-child{border-top:0}
  .tk{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--subtle);width:42px;flex:none}
  .trow.note .tk{color:var(--accent)}
  .tt{flex:1;color:var(--ink)} .tm2{color:var(--subtle);font-variant-numeric:tabular-nums;flex:none}

  .empty{text-align:center;color:var(--subtle);font-size:15px;padding:60px 30px;line-height:1.6}
  .morecards{text-align:center;color:var(--subtle);font-size:12px;padding:18px;font-family:var(--mono)}
  .pview{padding:16px 20px 60px;max-width:640px}
  .pcard{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:18px 20px;margin-bottom:16px}
  .pcard h4{margin:0 0 6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .pview .prow #profsel{flex:1}
  .crow{margin:14px 0;font-size:13px}
  .crow b{display:block;font-weight:700;margin-bottom:6px;color:var(--ink)}
  .clist{margin:4px 0 0;padding-left:18px;color:var(--muted);line-height:1.65}
  .rrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--hair);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--surface)}
  .rrow:hover{border-color:var(--subtle)}
  .rtitle{font-weight:700;font-size:14px;letter-spacing:-.01em}
  .rco{font-size:12px;color:var(--muted);margin-top:2px}
  .kbanner{padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:16px}
  .kbanner.ok{color:var(--good);background:var(--good-soft)} .kbanner.warn{color:var(--ok);background:rgba(201,138,18,.12)}
  .kform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kf{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .kf .excl,.kf select{width:100%}
  .kf textarea.excl{resize:vertical;font-family:inherit}
  .act.queue:hover{background:rgba(201,138,18,.14);color:var(--ok)}
  .act.queue.on{color:var(--ok)}
  .qwrap{border:1px solid var(--hair);border-radius:12px;margin-bottom:8px;background:var(--surface)}
  .qwrap .rrow{border:0;margin:0;background:transparent}
  .drybtn{flex:none;padding:6px 12px;font-size:12px;font-weight:600;border:1px solid var(--hair);border-radius:9px;background:var(--surface);color:var(--ink);cursor:pointer}
  .drybtn:hover{border-color:var(--accent);color:var(--accent)} .drybtn:disabled{opacity:.6;cursor:default}
  .dryprev{padding:0 14px 14px;font-size:12.5px}
  .drymeta{color:var(--muted);padding:6px 0 10px}
  .drytbl{width:100%;border-collapse:collapse}
  .drytbl td{padding:6px 8px;border-top:1px solid var(--hair);vertical-align:top}
  .drytbl td:first-child{color:var(--muted);width:44%}
  .req{color:var(--bad)} .tag{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--good-soft);color:var(--good)}
  .dryopen{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(201,138,18,.10);color:var(--ink)}
  .dryopen ul{margin:6px 0 0 16px;padding:0} .dryopen li{margin:2px 0;color:var(--muted)}
  .dryblock{padding:10px 12px;border-radius:10px;background:rgba(201,138,18,.12);color:var(--ok);font-weight:600}
  .prepok{padding:10px 12px;border-radius:10px;background:var(--good-soft);color:var(--good);font-weight:600}
  .prepblock{padding:10px 12px;border-radius:10px;background:rgba(201,138,18,.12);color:var(--ink)}
  .prepblock b{color:var(--ok)} .prepblock ul{margin:6px 0 0 16px;padding:0} .prepblock li{margin:3px 0;color:var(--muted)}
  .prepbtn:hover{border-color:var(--good);color:var(--good)}
  .pcardrow{border:1px solid var(--hair);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
  .pcr-h{display:flex;align-items:center;gap:12px}
  .ppill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--hairwash,rgba(120,120,120,.12));color:var(--muted);white-space:nowrap}
  .ppill.ok{background:var(--good-soft);color:var(--good)} .ppill.warn{background:rgba(201,138,18,.14);color:var(--ok)}
  .asbtn{flex:none;padding:6px 12px;font-size:12px;font-weight:600;border:1px solid var(--good);border-radius:9px;background:var(--good-soft);color:var(--good);cursor:pointer}
  .asbtn:disabled{opacity:.55;cursor:default}
  .pbl{margin:8px 0 0 18px;padding:0} .pbl li{color:var(--muted);font-size:12px;margin:2px 0}
  .asstat{margin-top:8px}
  .openqs{margin-top:10px;border-top:1px solid var(--hair);padding-top:10px}
  .oqh{font-size:12px;color:var(--muted);margin-bottom:8px}
  .oqrow{margin-bottom:12px}
  .oql{font-size:12.5px;color:var(--ink);margin-bottom:5px}
  .oqopts{display:flex;flex-wrap:wrap;gap:6px}
  .oqpick{text-align:left;padding:6px 10px;font-size:12px;border:1px solid var(--hair);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;max-width:100%}
  .oqpick:hover{border-color:var(--accent);color:var(--accent)}
  .oqpick.sel{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
  .oqfree{display:flex;gap:6px} .oqfree .oqtext{flex:1}
  .oqsave{padding:6px 12px;font-size:12px;border:1px solid var(--hair);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
  .oqmsg{display:inline-block;margin-top:5px;color:var(--good)}
  .oqrow.oqdone .oql{color:var(--muted)}
  .dryfoot{margin-top:10px} .dryshot{color:var(--accent);font-weight:600;text-decoration:none}
  @media(max-width:560px){ .kform{grid-template-columns:1fr} }

  /* ---------- right column ---------- */
  aside{width:350px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;padding:8px 18px 30px;
    display:flex;flex-direction:column;gap:16px}
  .search{position:sticky;top:0;display:flex;align-items:center;gap:10px;background:var(--lift);
    border:1px solid transparent;border-radius:9999px;padding:10px 15px}
  .search:focus-within{background:var(--surface);border-color:var(--accent)}
  .search input{border:0;background:transparent;color:var(--ink);font-size:15px;width:100%;outline:none}
  .search .ic{color:var(--subtle);flex:none}
  .panel{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:16px 18px}
  .panel h3{margin:0 0 12px;font-size:19px;font-weight:800;letter-spacing:-.01em}
  .frow{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted);
    padding:7px 0}
  .frow select{font-family:inherit;font-size:14px;background:var(--lift);color:var(--ink);border:1px solid var(--hair);
    border-radius:8px;padding:5px 8px}
  .excl-row{padding:6px 0 2px}
  .excl{width:100%;background:var(--lift);border:1px solid var(--hair);border-radius:8px;padding:8px 11px;
    color:var(--ink);font-size:13px;outline:none;font-family:inherit}
  .excl:focus{border-color:var(--accent)}
  .prow{display:flex;gap:8px;align-items:center}
  #profsel{flex:1;font-family:inherit;font-size:14px;background:var(--lift);color:var(--ink);border:1px solid var(--hair);border-radius:8px;padding:8px 10px}
  .btn.mini{padding:7px 11px;font-size:13px;flex:none}
  .seg{display:flex;gap:4px;background:var(--lift);border:1px solid var(--hair);border-radius:9px;padding:3px;margin-top:8px}
  .segbtn{flex:1;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:6px;border-radius:6px;cursor:pointer}
  .segbtn.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
  #loc-radius{font-family:inherit;font-size:13px;background:var(--lift);color:var(--ink);border:1px solid var(--hair);border-radius:8px;padding:7px}
  .btn.upload{display:block;text-align:center;cursor:pointer;margin-top:8px}
  .switch{position:relative;width:38px;height:22px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--hair);border-radius:9999px;transition:.15s}
  .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;
    border-radius:50%;transition:.15s}
  .switch input:checked + .slider{background:var(--accent)}
  .switch input:checked + .slider:before{transform:translateX(16px)}
  .srow{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);padding:6px 0}
  .srow .d{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
  .srow .d.err{background:var(--danger)}
  .srow .ago{margin-left:auto;color:var(--subtle);font-variant-numeric:tabular-nums}
  .hint{font-size:12px;color:var(--subtle);font-family:var(--mono);line-height:1.7}

  @media (max-width:1180px){ aside{display:none} .center{border-right:0} }
  @media (max-width:820px){ nav{width:72px} .brand span,.navitem .lab,.badge,.navfoot,.streak-count{display:none}
    .sync{font-size:0;padding:14px} .sync::after{content:"↻";font-size:18px}
    .streak{padding:8px} }
</style>
</head>
<body>
<div class="app">
  <!-- LEFT NAV -->
  <nav>
    <div class="brand"><img class="logo" src="/assets/jobber-cat.png" alt=""><span>Jobber</span></div>
    <button class="navitem on" data-nav="jobs"><span class="ic" id="ic-home"></span><span class="lab">Home</span><span class="badge" id="b-jobs"></span></button>
    <button class="navitem" data-nav="saved"><span class="ic" id="ic-save"></span><span class="lab">Saved</span><span class="badge" id="b-saved"></span></button>
    <button class="navitem" data-nav="applied"><span class="ic" id="ic-apply"></span><span class="lab">Applied</span><span class="badge" id="b-applied"></span></button>
    <button class="navitem" data-nav="results"><span class="ic" id="ic-results"></span><span class="lab">Results</span></button>
    <button class="navitem" data-nav="apply"><span class="ic" id="ic-apply2"></span><span class="lab">Auto-Apply</span><span class="badge" id="b-queue"></span></button>
    <button class="navitem profile" data-nav="profile"><span class="ic" id="ic-profile"></span><span class="lab">Profile</span></button>
    <button class="sync" id="sync" title="Fetch the latest job postings from all sources (runs in the background)">Sync</button>
    <div class="streak" id="streak"></div>
    <div class="navfoot" id="foot">v0.1</div>
  </nav>

  <!-- CENTER -->
  <div class="center">
    <div class="chead" id="chead"></div>
    <div id="newbanner" class="newbanner" hidden></div>
    <div id="stream"></div>
  </div>

  <!-- RIGHT -->
  <aside>
    <div class="search">
      <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></span>
      <input id="q" placeholder="Search jobs, companies, skills" autocomplete="off">
    </div>
    <div class="panel">
      <h3>Refine</h3>
      <div class="submeta">View</div>
      <div class="seg" id="viewseg">
        <button class="segbtn on" data-view="recommended">Recommended</button>
        <button class="segbtn" data-view="local">Local</button>
        <button class="segbtn" data-view="remote">Remote</button>
      </div>
      <label class="frow" style="margin-top:12px">Minimum match
        <select id="minscore"><option value="0">Any</option><option value="65" selected>65+</option><option value="75">75+</option><option value="85">85+</option></select>
      </label>
      <label class="frow">Sort order
        <select id="sort"><option value="recommended" selected>Recommended</option><option value="score">Job Score: Highest</option><option value="score_asc">Job Score: Lowest</option><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="salary">Salary</option></select>
      </label>
      <label class="frow">Min salary
        <select id="minsalary"><option value="0" selected>Any</option><option value="60000">$60k+</option><option value="80000">$80k+</option><option value="100000">$100k+</option><option value="120000">$120k+</option></select>
      </label>
      <label class="frow">Employment
        <select id="emptype"><option value="">Any</option><option value="full_time">Full-time</option><option value="contract">Contract</option><option value="part_time">Part-time</option><option value="internship">Internship</option></select>
      </label>
      <label class="frow">Entry-friendly only<span class="switch"><input type="checkbox" id="entry"><span class="slider"></span></span></label>
      <label class="frow">Show hidden<span class="switch"><input type="checkbox" id="hidden"><span class="slider"></span></span></label>
      <div class="excl-row"><input id="exclude" class="excl" placeholder="Exclude words: clearance, senior…" autocomplete="off"></div>
    </div>
    <div class="panel">
      <h3>Location</h3>
      <label class="frow">Use my location<span class="switch"><input type="checkbox" id="geo-enabled"><span class="slider"></span></span></label>
      <div class="submeta" style="margin:2px 0 8px">On: adds local jobs within radius. Off: remote-only.</div>
      <div id="geo-controls">
        <div class="seg">
          <button class="segbtn" id="loc-manual" data-mode="manual">Manual</button>
          <button class="segbtn" id="loc-geo" data-mode="geo">Locate me</button>
        </div>
        <div id="loc-fields" class="locfields">
          <input id="loc-city" class="excl" placeholder="City" autocomplete="off">
          <div class="prow" style="margin-top:6px">
            <input id="loc-region" class="excl" placeholder="ST" style="max-width:64px" autocomplete="off">
            <select id="loc-radius"><option value="25">25 mi</option><option value="45">45 mi</option><option value="60">60 mi</option><option value="100">100 mi</option></select>
            <button class="btn mini" id="loc-set">Set</button>
          </div>
        </div>
        <div id="loc-status" class="hint" style="margin-top:8px"></div>
      </div>
    </div>
    <div class="panel">
      <h3>Sources</h3>
      <div class="submeta">Auto-refreshes every 4h · “Sync new jobs” pulls fresh right now</div>
      <div id="sources"><div class="hint">No sync yet.</div></div>
    </div>
    <div class="hint">j / k&nbsp;&nbsp;move &nbsp;·&nbsp; s&nbsp;save &nbsp;·&nbsp; a&nbsp;apply<br>x&nbsp;dismiss &nbsp;·&nbsp; enter&nbsp;open &nbsp;·&nbsp; /&nbsp;search</div>
  </aside>
</div>

<script>
const api=(p,o)=>fetch('/api/v1'+p,o).then(r=>r.json());
const ICON={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 9.7 12 3l9 6.7V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  bookmark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v18l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6 18 18M18 6 6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7M21 3l-9 9M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  profile:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.2 3.6-6.5 8-6.5s8 2.3 8 6.5"/></svg>',
  results:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21V9M4 21v-5M12 21V5M16 21v-9M20 21V3"/></svg>',
  zap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>',
};
document.getElementById('ic-home').innerHTML=ICON.home;
document.getElementById('ic-save').innerHTML=ICON.bookmark;
document.getElementById('ic-apply').innerHTML=ICON.send;
document.getElementById('ic-profile').innerHTML=ICON.profile;
document.getElementById('ic-results').innerHTML=ICON.results;
document.getElementById('ic-apply2').innerHTML=ICON.zap;

let jobs=[], tab='jobs', view='feed', sel=-1, detail=null, feedScroll=0, sinceTs=null;
const BATCH=30; let shown=BATCH;                    // windowed render: keep the DOM light
let semanticOn=false;                               // AI re-rank available? (set from /semantic/status)
let allJobs=[];                                     // master pool (rebuilt only on Refresh/Sync)
let sortMode='recommended';                         // client-side sort order (separate from view)
const TITLES={jobs:'Home',saved:'Saved',applied:'Applied',profile:'Profile',results:'Results',apply:'Auto-Apply'};
const PIPELINE=['APPLYING','APPLIED','PHONE_SCREEN','INTERVIEW','FINAL_INTERVIEW','OFFER'];
const STAGES=['VIEWED','SAVED','APPLYING','APPLIED','PHONE_SCREEN','INTERVIEW','FINAL_INTERVIEW','OFFER','REJECTED','WITHDRAWN','DISMISSED'];
const nice=s=>s.toLowerCase().replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

function band(n){return n>=85?['s-strong','Strong']:n>=70?['s-good','Good']:n>=60?['s-ok','Possible']:['s-weak','Weak'];}
function ago(iso){if(!iso)return '';
  if(!/[Z+]/.test(iso.slice(10)))iso+='Z';          // server times are UTC-naive; parse as UTC
  const d=(Date.now()-new Date(iso))/86400000; if(d<0)return 'just now';
  return d<1?Math.round(d*24)+'h':d<30?Math.round(d)+'d':Math.round(d/30)+'mo';}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const j2 = id => jobs.find(j=>j.id===id) || (detail&&detail.id===id?detail:null);

// Refresh (Sync / tab switch / refine-param change) rebuilds the master pool ONCE.
// Local geo jobs are already appended by the backend when geo is enabled (view=recommended
// returns remote+local, or remote-only when geo off). View/sort then filter IN MEMORY.
async function load(){
  const p=new URLSearchParams();
  const q=document.getElementById('q').value.trim(); if(q) p.set('q',q);
  if(tab==='jobs'){
    p.set('view','recommended');           // full pool for this profile (remote + local if geo on)
    p.set('min_score',document.getElementById('minscore').value);
    if(document.getElementById('hidden').checked) p.set('include_suppressed','true');
    const et=document.getElementById('emptype').value; if(et) p.set('employment_type',et);
    if(document.getElementById('entry').checked) p.set('entry_only','true');
    const ex=document.getElementById('exclude').value.trim(); if(ex) p.set('exclude',ex);
  } else if(tab==='saved') p.set('status','SAVED');
  else if(tab==='applied') p.set('status_in', PIPELINE.join(','));
  p.set('sort','priority');                 // always fetch in recommended order; sorting is client-side
  p.set('limit','800');                     // one generous pool; view/sort filter it in memory
  const ms=document.getElementById('minsalary').value; if(ms!=='0') p.set('min_salary', ms);
  allJobs=await api('/jobs?'+p.toString());
  await rerankPool();                        // AI recommendation order, computed ONCE per refresh
  applyView();                               // filter + sort in memory
  refreshBadges();                           // badges only refresh on a real pool rebuild / action
  document.getElementById('newbanner').hidden=true;
  if(tab==='jobs'){ try{ sinceTs=(await api('/now')).now; }catch(_){} }
}

// pure in-memory: switching view/sort NEVER refetches, re-scrapes, or re-geolocates
function filterView(list){
  if(tab!=='jobs') return list;
  if(currentView==='local')  return list.filter(j=>!j.remote);   // onsite/hybrid within radius
  if(currentView==='remote') return list.filter(j=>j.remote);
  return list;                                                   // recommended = full pool
}
function clientSort(list){
  const s=sortMode, a=list.slice(), dt=j=>new Date((j.date_posted||'')+((j.date_posted&&!/[Z+]/.test(j.date_posted.slice(10)))?'Z':''))||0;
  if(s==='score')      a.sort((x,y)=>y.relevance_score-x.relevance_score);
  else if(s==='score_asc') a.sort((x,y)=>x.relevance_score-y.relevance_score);
  else if(s==='newest')    a.sort((x,y)=>dt(y)-dt(x));
  else if(s==='oldest')    a.sort((x,y)=>dt(x)-dt(y));
  else if(s==='salary')    a.sort((x,y)=>(y.salary_max||0)-(x.salary_max||0));
  return a;                                                      // 'recommended' keeps pool order
}
function applyView(){                          // PURE in-memory — no network, no geolocation, no rescore
  jobs=clientSort(filterView(allJobs));
  sel=-1; view='feed'; shown=BATCH; renderHead(); renderFeed();
  if(semanticOn && currentView==='recommended' && sortMode==='recommended'){
    const sub=document.querySelector('.chead .sub'); if(sub) sub.textContent=jobs.length+' jobs · smart-ranked';
  }
}
async function rerankPool(){
  if(!semanticOn||tab!=='jobs'||!allJobs.length) return;
  const ids=allJobs.slice(0,60).map(j=>j.id);
  let res; try{ res=await api('/rerank',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})}); }catch(_){ return; }
  if(!res||!res.order) return;
  const pos={}; res.order.forEach((id,i)=>pos[id]=i);
  allJobs=allJobs.slice(0,60).sort((a,b)=>(pos[a.id]??99)-(pos[b.id]??99)).concat(allJobs.slice(60));
}

async function checkNew(){
  if(tab!=='jobs'||view!=='feed'||!sinceTs) return;
  const min=document.getElementById('minscore').value;
  let c=0; try{ c=(await api('/new_jobs_count?since='+encodeURIComponent(sinceTs)+'&min_score='+min)).count; }catch(_){}
  const el=document.getElementById('newbanner');
  if(c>0){
    el.innerHTML='<button>↑ Show '+c+' new job'+(c>1?'s':'')+'</button>';
    el.querySelector('button').onclick=()=>{ el.hidden=true; window.scrollTo(0,0); load(); };  // hide now, then refresh
    el.hidden=false;
  } else el.hidden=true;
}
setInterval(checkNew, 90000);   // while the 4h auto-sync runs, surface new arrivals

function renderHead(){
  const h=document.getElementById('chead');
  if(view==='detail'){
    h.innerHTML=`<button class="iconbtn" data-act="back" data-id="">${ICON.back}</button><h2>Job</h2>`;
  }else if(tab==='profile'){
    h.innerHTML=`<h2>Profile</h2>`;
  }else if(tab==='results'){
    h.innerHTML=`<h2>Results</h2>`;
  }else if(tab==='apply'){
    h.innerHTML=`<h2>Auto-Apply</h2>`;
  }else{
    h.innerHTML=`<h2>${TITLES[tab]}</h2><span class="sub">${jobs.length} jobs</span>`;
  }
}

function actionBar(j){
  const saved=j.status==='SAVED', applied=j.status==='APPLIED';
  return `<div class="acts">
    <button class="act save ${saved?'on':''}" data-act="save" data-id="${j.id}" title="${saved?'Saved':'Save'}"><span class="ic">${ICON.bookmark}</span></button>
    <button class="act apply ${applied?'on':''}" data-act="apply" data-id="${j.id}" title="${applied?'Marked applied — click to undo':'Mark as applied'}"><span class="ic">${ICON.check}</span>${applied?'Applied':''}</button>
    <button class="act queue" data-act="queue" data-id="${j.id}" title="Queue for auto-apply"><span class="ic">${ICON.zap}</span></button>
    <button class="act dismiss" data-act="dismiss" data-id="${j.id}" title="Not interested"><span class="ic">${ICON.x}</span></button>
    <button class="act visit spacer" data-act="visit" data-id="${j.id}" title="Open the job posting to apply"><span class="ic">${ICON.ext}</span>Apply ↗</button>
    <button class="act why" data-act="details" data-id="${j.id}">Details ›</button>
  </div>`;
}

function money(j){
  if(!j.salary_min) return '';
  const k=v=>'$'+Math.round(v/1000)+'K';
  return ' · '+k(j.salary_min)+(j.salary_max&&j.salary_max!==j.salary_min?'–'+k(j.salary_max):'');
}
function card(j){
  const [cls]=band(j.relevance_score);
  const loc=(j.remote?'Remote':(j.location_name||j.workplace_type||'—'))+money(j);
  const open=expanded.has(j.id);
  const more = open ? `<div class="more">${
    j.description_snippet ? esc(j.description_snippet)+'…' : '<span class="tempty">No description provided.</span>'
  }</div>` : '';
  return `<div class="card ${open?'open':''}" data-id="${j.id}">
    <div class="ring ${cls}"><span class="n">${j.relevance_score}</span></div>
    <div class="cbody">
      <div class="ctop"><span class="t">${esc(j.title)}</span><span class="co">${esc(j.company_name)}</span>${j.freshness==='EXPIRED'?'<span class="xflag">Expired</span>':''}</div>
      <div class="cloc">${esc(loc)}</div>
      ${more}
      ${actionBar(j)}
    </div></div>`;
}

const expanded=new Set();
function toggleCard(id){                            // pure client-side: snippet ships with the list
  if(!jobs.find(x=>x.id===id)) return;
  expanded.has(id) ? expanded.delete(id) : expanded.add(id);
  renderOneCard(id);
}
function renderOneCard(id){
  const j=jobs.find(x=>x.id===id);
  const el=document.querySelector('.card[data-id="'+id+'"]');
  if(el&&j) el.outerHTML=card(j);
}

function renderFeed(){
  const s=document.getElementById('stream');
  if(!jobs.length){ s.innerHTML=`<div class="empty">${tab==='jobs'?'No jobs match. Hit <b>Sync</b> to pull fresh postings, or loosen filters.':'Nothing here yet.'}</div>`; return; }
  s.innerHTML=jobs.slice(0,shown).map(card).join('')
    + (jobs.length>shown?`<div class="morecards">${jobs.length-shown} more · scroll to load</div>`:'');
}
window.addEventListener('scroll',()=>{
  if(view!=='feed'||shown>=jobs.length) return;
  if(window.innerHeight+window.scrollY >= document.documentElement.scrollHeight-800){
    shown=Math.min(shown+BATCH, jobs.length); renderFeed();
  }
});

async function openDetail(id){
  feedScroll=window.scrollY;
  const j=await api('/jobs/'+encodeURIComponent(id));
  detail=j; view='detail'; renderHead(); window.scrollTo(0,0);
  const [,lab]=band(j.relevance_score);
  const saved=j.status==='SAVED', applied=j.status==='APPLIED';
  const facs=j.score_breakdown.map(f=>`<div class="fac">
    <div class="top"><b>${esc(f.factor)}</b><span class="pts">${f.got} / ${f.max}</span></div>
    <div class="bar"><i style="width:${Math.round(100*f.got/f.max)}%"></i></div>
    <div class="det">${esc(f.detail)}</div></div>`).join('');
  const sal=j.salary_min?`$${Math.round(j.salary_min/1000)}K–$${Math.round((j.salary_max||j.salary_min)/1000)}K`:'—';
  document.getElementById('stream').innerHTML=`<div class="detail">
    <div class="eyebrow">${lab} match · ${j.relevance_score}%</div>
    <h1>${esc(j.title)}</h1>
    <div class="sub">${esc(j.company_name)}${j.company_domain?' · '+esc(j.company_domain):''}</div>
    <span class="verified">✓ Verified source · ${esc(j.source_type)}</span>
    <div class="dacts">
      <button class="btn primary" data-act="visit" data-id="${j.id}">Apply on site ↗</button>
      <button class="btn ${applied?'on':''}" data-act="apply" data-id="${j.id}">${applied?'Applied ✓':'Mark applied'}</button>
      <button class="btn ${saved?'on':''}" data-act="save" data-id="${j.id}">${saved?'Saved ✓':'Save'}</button>
      <button class="btn" data-act="dismiss" data-id="${j.id}">Dismiss</button>
    </div>
    <div class="dpanel"><h4>Why it matches</h4>${facs}</div>
    <div class="dpanel"><div class="kv">
      <span>Work mode · <b>${j.remote?'Remote':esc(j.workplace_type)}</b></span>
      <span>Location · <b>${esc(j.location_name||'—')}</b></span>
      <span>Seniority · <b>${esc(j.seniority)}</b></span>
      <span>Salary · <b>${sal}</b></span>
      <span>Posted · <b>${ago(j.date_posted)||'—'} ago</b></span></div></div>
    <div class="dpanel"><h4>Stage</h4>
      <select id="stage" class="stage">${STAGES.map(s=>`<option value="${s}" ${s===j.status?'selected':''}>${nice(s)}</option>`).join('')}</select>
    </div>
    <div class="dpanel"><h4>Activity</h4>
      <div class="noteadd"><input id="noteinput" placeholder="Add a note…" autocomplete="off"><button class="btn" id="noteAdd">Add</button></div>
      <div id="timeline" class="timeline"></div>
    </div>
    <div class="dpanel"><h4>Description</h4><div class="desc">${esc(j.description_text).slice(0,4000)}</div></div>
  </div>`;
  document.getElementById('stage').onchange=e=>setStage(j.id,e.target.value);
  document.getElementById('noteAdd').onclick=()=>addNote(j.id);
  document.getElementById('noteinput').addEventListener('keydown',e=>{if(e.key==='Enter')addNote(j.id);});
  loadActivity(j.id);
}

async function setStage(id,status){
  await api('/jobs/'+encodeURIComponent(id)+'/status?status='+status,{method:'POST'});
  const jj=jobs.find(x=>x.id===id); if(jj) jj.status=status; if(detail&&detail.id===id) detail.status=status;
  refreshBadges(); loadActivity(id);
}
async function addNote(id){
  const el=document.getElementById('noteinput'); const text=el.value.trim(); if(!text) return;
  await api('/jobs/'+encodeURIComponent(id)+'/notes',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  el.value=''; loadActivity(id);
}
async function loadActivity(id){
  const el=document.getElementById('timeline'); if(!el) return;
  const acts=await api('/jobs/'+encodeURIComponent(id)+'/activity');
  el.innerHTML = acts.length ? acts.map(a=>`<div class="trow ${a.kind}">
    <span class="tk">${a.kind==='note'?'Note':'Stage'}</span>
    <span class="tt">${esc(a.text)}</span><span class="tm2">${ago(a.ts)} ago</span></div>`).join('')
    : '<div class="tempty">No activity yet.</div>';
}

function back(){ view='feed'; detail=null; renderHead(); renderFeed(); window.scrollTo(0,feedScroll); }

async function doAction(act, id){
  const j=j2(id); if(!j) return;
  let newStatus=j.status;
  if(act==='save')         newStatus = j.status==='SAVED' ? 'VIEWED' : 'SAVED';
  else if(act==='apply')   newStatus = j.status==='APPLIED' ? 'VIEWED' : 'APPLIED';  // toggle only, no navigation
  else if(act==='queue')   newStatus = j.status==='AUTO_QUEUED' ? 'VIEWED' : 'AUTO_QUEUED';  // queue for auto-apply
  else if(act==='dismiss') newStatus='DISMISSED';
  // persist
  if(newStatus==='SAVED') await api('/jobs/'+encodeURIComponent(id)+'/save',{method:'POST'});
  else if(newStatus==='DISMISSED') await api('/jobs/'+encodeURIComponent(id)+'/dismiss',{method:'POST'});
  else await api('/jobs/'+encodeURIComponent(id)+'/status?status='+newStatus,{method:'POST'});
  j.status=newStatus;
  const jj=jobs.find(x=>x.id===id); if(jj) jj.status=newStatus;

  if(view==='detail'){ if(act==='dismiss') back(); else openDetail(id); refreshBadges(); return; }
  const goneFromFeed=['DISMISSED','AUTO_QUEUED','APPLIED','PHONE_SCREEN','INTERVIEW','FINAL_INTERVIEW','OFFER','REJECTED','WITHDRAWN'];
  const drop = (tab==='jobs'&&goneFromFeed.includes(newStatus))||(tab==='saved'&&newStatus!=='SAVED')||(tab==='applied'&&newStatus!=='APPLIED');
  if(drop){                                         // remove just this card, don't rebuild the feed
    jobs=jobs.filter(x=>x.id!==id); allJobs=allJobs.filter(x=>x.id!==id);   // keep pool consistent
    const el=document.querySelector('.card[data-id="'+id+'"]'); if(el) el.remove();
  } else renderOneCard(id);
  renderHead(); refreshBadges();
}

// delegated clicks across header + stream
document.querySelector('.center').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){ e.stopPropagation(); const act=a.dataset.act;
    if(act==='back') back();

});

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){ if(e.key==='Escape')e.target.blur(); return; }
  if(e.key==='/'){ e.preventDefault(); document.getElementById('q').focus(); return; }
  if(e.key==='Escape'&&view==='detail'){ back(); return; }
  if(view!=='feed'||!jobs.length) return;
  if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,jobs.length-1); highlight(); }
  else if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); highlight(); }
  else if(e.key==='Enter'&&sel>=0){ toggleCard(jobs[sel].id); }
  else if(sel>=0&&['s','a','x'].includes(e.key)){ doAction({s:'save',a:'apply',x:'dismiss'}[e.key], jobs[sel].id); }
});
function highlight(){
  if(sel>=shown){ shown=Math.min(sel+5, jobs.length); renderFeed(); }   // grow window to reach it
  const cards=[...document.querySelectorAll('.card')];
  cards.forEach((c,i)=>c.classList.toggle('sel',i===sel));
  if(cards[sel]) cards[sel].scrollIntoView({block:'center'}); }

// pick-and-save UI for flagged questions -> saved to the answer library, auto-fills next run
function openQ(qs){
  qs=(qs||[]).filter(q=>q&&q.label);
  if(!qs.length) return '';
  return `<div class="openqs"><div class="oqh">Tell it what to pick — answer once, it saves to your library and auto-fills every run after:</div>${qs.map(q=>{
    const opts=(q.options||[]);
    const body = opts.length
      ? `<div class="oqopts">${opts.map(o=>`<button class="oqpick" data-q="${esc(q.label)}" data-a="${esc(o)}">${esc(o.length>72?o.slice(0,72)+'…':o)}</button>`).join('')}</div>`
      : `<div class="oqfree"><input class="oqtext excl" data-q="${esc(q.label)}" placeholder="Type your answer"><button class="oqsave">Save</button></div>`;
    return `<div class="oqrow"><div class="oql">${esc(q.label)}${q.required?' <span class="req">*</span>':''}</div>${body}<span class="oqmsg hint"></span></div>`;
  }).join('')}</div>`;
}

function renderPrep(r){
  const shot=r.shot?`<a class="dryshot" href="/api/v1/apply/shot/${encodeURIComponent(r.job_id)}" target="_blank">View filled-form screenshot ↗</a>`:'';
  if(r.status==='ready_to_submit')
    return `<div class="prepok">✓ Submission-ready — all required fields filled${r.submit_text?` · button: “${esc(r.submit_text)}”`:''}. Nothing was submitted; review the screenshot, then apply on the real page.</div>
      <div class="drymeta">${r.entered||0} fields entered · ${r.field_count||0} on the form.</div>${openQ(r.open)}<div class="dryfoot">${shot}</div>`;
  if(r.status==='error') return `<div class="dryblock">Couldn’t process this form: ${esc(r.reason||'')}</div><div class="dryfoot">${shot}</div>`;
  const bl=(r.blockers||[]).map(b=>`<li>${esc(b)}</li>`).join('');
  return `<div class="prepblock"><b>${(r.blockers||[]).length} thing(s) would stop this application:</b><ul>${bl}</ul></div>
    <div class="drymeta">${r.entered||0} fields entered · ${r.field_count||0} on the form.</div>${openQ(r.open)}<div class="dryfoot">${shot}</div>`;
}

function renderDry(r){
  if(r.status==='blocked') return `<div class="dryblock">⚠ ${esc(r.reason||'blocked')} — hand this one off to apply manually (no CAPTCHA/login is ever bypassed).</div>`;
  if(r.status==='error')   return `<div class="dryblock">Couldn’t read this form: ${esc(r.reason||'')}</div>`;
  const rows=(r.filled||[]).map(f=>`<tr><td>${esc(f.label||'')}${f.required?' <span class="req">*</span>':''}</td><td>${esc(f.option||f.value||'')}${f.type==='file'?' <span class="tag">file</span>':''}</td></tr>`).join('');
  const open=(r.open||[]).length?`<div class="dryopen"><b>${r.open.length} question${r.open.length>1?'s':''} still need an answer</b> (drafted by the AI tier in a later phase):<ul>${r.open.map(q=>`<li>${esc(q.label)}${q.note?` <i>— ${esc(q.note)}</i>`:''}</li>`).join('')}</ul></div>`:'';
  const shot=r.shot?`<a class="dryshot" href="/api/v1/apply/shot/${encodeURIComponent(r.job_id)}" target="_blank">View page screenshot ↗</a>`:'';
  return `<div class="drymeta">Preview only — <b>nothing was submitted</b>. ${r.field_count||0} fields found · ${(r.filled||[]).length} auto-filled · ${(r.open||[]).length} open.</div>
    <table class="drytbl"><tbody>${rows||'<tr><td colspan=2>No standard fields matched.</td></tr>'}</tbody></table>${open}<div class="dryfoot">${shot}</div>`;
}

    <div class="pcard">
      <h4>Queue · ${st.queued||0} jobs</h4>
      <div class="submeta">Queue jobs from the feed with the ⚡ button, then hit <b>Dry run</b> to see exactly what the kit would fill on the real form — a safe preview with a screenshot, <b>nothing is submitted</b>. Review-then-submit comes in the next phase.</div>
      <div id="queuelist" style="margin-top:10px"></div>
    </div>
  </div>`;
  document.getElementById('ksave').onclick=async ()=>{
    const g=id=>document.getElementById('k-'+id), b=v=>v==='yes'?true:v==='no'?false:null;
    const data={ full_name:g('full_name').value.trim(), email:g('email').value.trim(), phone:g('phone').value.trim(),
      city:g('city').value.trim(), state:g('state').value.trim(), linkedin:g('linkedin').value.trim(),
      github:g('github').value.trim(), portfolio:g('portfolio').value.trim(), resume_path:g('resume_path').value.trim(),
      desired_salary:g('desired_salary').value.trim(), authorized_us:b(g('authorized_us').value),
      needs_sponsorship:b(g('needs_sponsorship').value), willing_relocate:b(g('willing_relocate').value),
      work_pref:g('work_pref').value.trim(), start_date:g('start_date').value.trim(),
      years_experience:parseInt(g('years_experience').value)||null, education_level:g('education_level').value.trim(),
      hear_about_us:g('hear_about_us').value.trim(), gender:g('gender').value.trim(), race:g('race').value.trim(),
      veteran_status:g('veteran_status').value.trim(), disability_status:g('disability_status').value.trim(),
      cover_letter_mode:g('cover_letter_mode').value, notes:g('notes').value };
    const r=await api('/apply/kit',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})});
    document.getElementById('ksaved').textContent = r.ready?'✓ Saved — kit ready':('Saved — still need: '+(r.missing||[]).join(', '));
    refreshBadges();
  };
  let queue=[]; try{ queue=await api('/apply/queue'); }catch(_){}
  document.getElementById('queuelist').innerHTML = queue.length? queue.map(qrow).join('')
    : '<div class="empty">No jobs queued yet. Use the ⚡ button on a job in the feed to queue it.</div>';
  const runInto=async (btn, path, render, working)=>{
    const prev=btn.closest('.qwrap').querySelector('.dryprev');
    if(prev.style.display==='block' && prev.dataset.done===btn.dataset.mode){ prev.style.display='none'; prev.dataset.done=''; return; }
    if(!st.kit_ready){ prev.style.display='block'; prev.innerHTML=`<div class="dryblock">Fill your Application Kit first — still need: ${(st.kit_missing||[]).join(', ')}</div>`; return; }
    prev.style.display='block'; prev.innerHTML=`<div class="drymeta">${working}</div>`;
    btn.disabled=true; const old=btn.textContent; btn.textContent='Running…';
    try{ const r=await api(path,{method:'POST'}); prev.innerHTML=render(r); prev.dataset.done=btn.dataset.mode; }
    catch(e){ prev.innerHTML='<div class="dryblock">Run failed. Is the job page reachable?</div>'; }
    btn.disabled=false; btn.textContent=old;
  };
  function wireQueue(){
    document.querySelectorAll('#queuelist .qopen').forEach(o=>o.onclick=()=>openDetail(o.closest('.qwrap').dataset.id));
    document.querySelectorAll('#queuelist .drybtn').forEach(btn=>{ btn.dataset.mode='dry';
      btn.onclick=()=>runInto(btn,'/apply/dryrun/'+encodeURIComponent(btn.dataset.dry),renderDry,'Opening the apply page and reading the form… (~5s, nothing is submitted)'); });
    document.querySelectorAll('#queuelist .prepbtn').forEach(btn=>{ btn.dataset.mode='prep';
      btn.onclick=()=>runInto(btn,'/apply/prepare/'+encodeURIComponent(btn.dataset.prep),renderPrep,'Filling the real form and checking every required field… (~8s, nothing is submitted)'); });
  }
  wireQueue();

  // ---- bulk queue top-N from the feed ----
  const qtop=document.getElementById('queuetop');
  if(qtop) qtop.onclick=async ()=>{
    const n=Math.max(1,Math.min(50,parseInt(document.getElementById('qtopn').value)||50));
    qtop.disabled=true; document.getElementById('qtophint').textContent='Queuing…';
    try{ const r=await api('/apply/queue-top',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({count:n,view:view==='apply'?'recommended':view})});
      document.getElementById('qtophint').textContent = r.queued
        ? `Queued ${r.queued} — queue now ${r.queue_total}. Hit “Prepare all queued”.`
        : (r.room===0?'Queue is already full (50).':'No new jobs to queue.');
      refreshBadges(); const qh=[...document.querySelectorAll('.pcard h4')].find(h=>h.textContent.startsWith('Queue')); if(qh) qh.textContent=`Queue · ${r.queue_total} jobs`;
      let queue=[]; try{ queue=await api('/apply/queue'); }catch(_){}
      const ql=document.getElementById('queuelist'); if(ql){ ql.innerHTML=queue.length?queue.map(qrow).join(''):'<div class="empty">No jobs queued yet.</div>'; wireQueue(); }
    }catch(e){ document.getElementById('qtophint').textContent='Could not queue.'; }
    qtop.disabled=false;
  };

  // ---- batch prepare-all + assisted submit ----
  const prepAll=document.getElementById('prepall');
  if(prepAll){
    prepAll.onclick=async ()=>{
      prepAll.disabled=true;
      try{ await api('/apply/prepare-all',{method:'POST'}); }catch(e){ prepAll.disabled=false; return; }
      pollPrep();
    };
    renderPrepStatus();   // show any prior run's results on load
  }
  async function renderPrepStatus(){ try{ pollPrep(true); }catch(_){} }
  async function pollPrep(once){
    let s; try{ s=await api('/apply/prepare-all/status'); }catch(e){ return; }
    const prog=document.getElementById('prepprog'); const box=document.getElementById('prepresults');
    if(!prog||!box) return;
    if(s.running){ prog.textContent=`Preparing ${s.done}/${s.total}… (fills + AI answers + verify, ~10-25s each)`; prepAll.disabled=true; }
    else { prog.textContent=s.results&&s.results.length?`${s.ready||0} of ${s.results.length} ready to submit`:''; prepAll.disabled=false; }
    box.innerHTML=(s.results||[]).map(prepCard).join('');
    wireAssist();
    if(s.running && !once) setTimeout(pollPrep,3000);
  }
  function prepCard(r){
    const ready=r.status==='ready_to_submit';
    const pill=ready?'<span class="ppill ok">Ready</span>':r.status==='blocked'?'<span class="ppill warn">Blocked</span>':`<span class="ppill">${esc(r.status||'')}</span>`;
    const shot=r.shot?`<a class="dryshot" href="/api/v1/apply/shot/${encodeURIComponent(r.job_id)}" target="_blank">screenshot ↗</a>`:'';
    const bl=(r.blockers||[]).length?`<ul class="pbl">${r.blockers.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:'';
    const act=ready?`<button class="btn asbtn" data-assist="${esc(r.job_id)}">Open &amp; submit</button>`:'';
    return `<div class="pcardrow" data-id="${esc(r.job_id)}"><div class="pcr-h">${pill}
      <div style="flex:1"><div class="rtitle">${esc(r.title||'')}</div><div class="rco">${esc(r.company||'')} · ${r.filled} filled${r.open?` · ${r.open} open`:''} ${shot}</div></div>${act}</div>
      ${bl}${openQ(r.questions)}<div class="asstat" style="display:none"></div></div>`;
  }
  function wireAssist(){
    document.querySelectorAll('#prepresults .asbtn').forEach(btn=>btn.onclick=async ()=>{
      const row=btn.closest('.pcardrow'); const stat=row.querySelector('.asstat');
      stat.style.display='block'; stat.innerHTML='<span class="hint">Opening a browser window with your details pre-filled — review every field, then click the form’s Submit. Jobber will detect the confirmation.</span>';
      btn.disabled=true;
      try{ await api('/apply/assist/'+encodeURIComponent(btn.dataset.assist),{method:'POST'}); }catch(e){ stat.innerHTML='<span class="hint">Could not open the browser session.</span>'; btn.disabled=false; return; }
      pollAssist(btn.dataset.assist,row,btn);
    });
  }
  async function pollAssist(id,row,btn){
    let all; try{ all=await api('/apply/assist/status'); }catch(e){ return; }
    const s=all[id]||{status:'none'}; const stat=row.querySelector('.asstat');
    const msg={opening:'Opening browser…',review:'Filled — review the form and click Submit.',submitted:'✓ Submitted — marked as applied.',closed:'Browser closed before submit.',error:'Session error.'}[s.status]||s.status;
    stat.innerHTML=`<span class="hint">${esc(msg)}${s.reason&&s.status!=='review'?' — '+esc(s.reason):''}</span>`;
    if(s.status==='submitted'){ row.querySelector('.ppill').outerHTML='<span class="ppill ok">Applied</span>'; btn.remove(); refreshBadges(); return; }
    if(['closed','error','none'].includes(s.status)){ btn.disabled=false; return; }
    setTimeout(()=>pollAssist(id,row,btn),2500);
  }
}

api('/semantic/status').then(s=>{semanticOn=!!s.enabled;}).catch(()=>{});
// one delegated handler for all "answer this question" pick/save buttons (survives re-renders)
document.addEventListener('click', async (e)=>{
  const pick=e.target.closest('.oqpick'); const save=e.target.closest('.oqsave');
  if(!pick && !save) return;
  const row=(pick||save).closest('.oqrow'); const msg=row.querySelector('.oqmsg');
  let q, a;
  if(pick){ q=pick.dataset.q; a=pick.dataset.a; }
  else { const inp=row.querySelector('.oqtext'); q=inp.dataset.q; a=(inp.value||'').trim(); }
  if(!a){ msg.textContent='type an answer first'; return; }
  msg.textContent='saving…';
  try{ await api('/apply/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,answer:a})});
    msg.textContent='✓ saved — re-run Prepare/Fill & check to auto-fill'; row.classList.add('oqdone');
    if(pick){ row.querySelectorAll('.oqpick').forEach(b=>b.classList.remove('sel')); pick.classList.add('sel'); }
  }catch(err){ msg.textContent='could not save'; }
});
renderLocation(); renderSources(); load();
</script>
