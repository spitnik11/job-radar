<!doctype html><meta charset="utf-8"><title>Mock — Ashby custom radios</title>
<style>.opt input{opacity:0;position:absolute;width:24px;height:24px}</style>
<h1>Apply</h1>
<form onsubmit="return false">
  <fieldset class="_fieldEntry">
    <label class="_heading _required _label">Are you authorized to work in the country you currently reside in?</label>
    <div class="_option opt"><span class="_container"><input type="radio" name="auth1" id="a1y"></span><label class="_label" for="a1y">Yes</label></div>
    <div class="_option opt"><span class="_container"><input type="radio" name="auth1" id="a1n"></span><label class="_label" for="a1n">No</label></div>
  </fieldset>
  <fieldset class="_fieldEntry">
    <label class="_heading _required _label">Do you have the legal right to work in the country where you would be based?</label>
    <div class="_option opt"><span class="_container"><input type="radio" name="auth2" id="a2y"></span><label class="_label" for="a2y">Yes</label></div>
    <div class="_option opt"><span class="_container"><input type="radio" name="auth2" id="a2n"></span><label class="_label" for="a2n">No</label></div>
  </fieldset>
  <button type="submit">Submit Application</button>
</form>
