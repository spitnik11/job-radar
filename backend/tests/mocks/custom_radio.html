<!doctype html><meta charset="utf-8"><title>Mock — custom radio via library</title>
<h1>Apply</h1>
<form onsubmit="return false">
  <fieldset class="_fieldEntry">
    <label class="_heading _required _label">Which team are you applying to?</label>
    <div class="_option"><input type="radio" name="team" id="tp"><label for="tp">Platform</label></div>
    <div class="_option"><input type="radio" name="team" id="tg"><label for="tg">Growth</label></div>
    <div class="_option"><input type="radio" name="team" id="ti"><label for="ti">Infrastructure</label></div>
  </fieldset>
  <button type="submit">Submit Application</button>
</form>
