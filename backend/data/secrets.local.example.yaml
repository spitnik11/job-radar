# USAJOBS credentials. Copy this file to `secrets.local.yaml` (same folder) and fill in.
# secrets.local.yaml is gitignored (data/*.local.yaml) and never committed.
# Get a FREE key instantly: https://developer.usajobs.gov/apirequest/
# (Alternatively set env vars USAJOBS_API_KEY and USAJOBS_EMAIL before launching.)

usajobs:
  api_key: paste-your-usajobs-api-key-here
  email: your-registered-email@example.com
