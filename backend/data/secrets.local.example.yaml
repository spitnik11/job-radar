# USAJOBS credentials. Copy this file to `secrets.local.yaml` (same folder) and fill in.
# secrets.local.yaml is gitignored (data/*.local.yaml) and never committed.
# Get a FREE key instantly: https://developer.usajobs.gov/apirequest/
# (Alternatively set env vars USAJOBS_API_KEY and USAJOBS_EMAIL before launching.)

usajobs:
  api_key: paste-your-usajobs-api-key-here
  email: your-registered-email@example.com

# Email application tracker (optional). Reads your mailbox over IMAP to auto-detect Offer/Rejection
# emails and update matching Applied jobs. Read-only. For Gmail use an App Password (not your login),
# with IMAP enabled. Inert unless configured.
email:
  host: imap.gmail.com
  user: you@gmail.com
  password: your-app-password        # Gmail: create at myaccount.google.com/apppasswords
  folder: INBOX
  since_days: 30
